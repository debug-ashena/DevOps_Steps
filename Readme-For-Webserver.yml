«در مدیریت سرور لینوکس یک پارادوکسِ بزرگ وجود دارد:
اگر آپدیت نکنی: نگران حفره‌های امنیتی هستی.
اگر آپدیت کنی: نگران پایداری سرویس هستی.

سوال: مرزِ طلایی بین “امنیت” و “پایداری” کجاست؟
آیا باید هر آپدیتی را سریع اعمال کرد (حتی با ریسکِ Downtime) یا باید صبر کرد تا نسخه کاملاً در کامیونیتی تست شود؟

راهکار:
تغییرِ استراتژی از مدیریت دستی به مدیریت مبتنی بر زیرساخت (IaC) و استقرارِ گام‌ به‌ گام

روش ۱ : استراتژی Blue-Green Deployment (یا Canary)
روش ۲: مفهوم Immutable Infrastructure (زیرساخت غیرقابل تغییر)
روش ۳: اتوماسیونِ تست (Pre-flight Checks)


این فایل webserver.yml برای نشان دادن نحوه کمک گرفتن از Ansible برای تعریف حالت مطلوب سرور پیش از آپدیت/ در پروسه آپدیت است.
در انسیبل (Declarative)، شما می‌گویید: «من می‌خواهم وضعیتِ نهایی سرور این‌گونه باشد»؛ انسیبل خودش چک می‌کند که آیا آن وضعیت برقرار است یا نه. اگر بود، کاری نمی‌کند؛ اگر نبود، آن را اصلاح می‌کند.

